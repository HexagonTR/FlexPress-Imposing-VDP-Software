name: Apple Notarization Poller

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  repository_dispatch:
    types: [trigger-poller]
  workflow_dispatch: # Manual trigger

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      has_id: ${{ steps.check.outputs.has_id }}
    steps:
      - name: Restore Notarization ID
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            .notarization_id
            .notarization_tag
          key: notarize-ready-
          restore-keys: |
            notarize-ready-
            notarize-id-

      - name: Check for pending ID
        id: check
        run: |
          if [ -f .notarization_id ] && [ -s .notarization_id ]; then
            echo "has_id=true" >> $GITHUB_OUTPUT
            echo "✅ Pending notarization found."
          else
            echo "has_id=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No pending notarization."
          fi

  poll:
    needs: pre-check
    if: ${{ needs.pre-check.outputs.has_id == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MANUAL_APPLE_ID: ${{ secrets.APPLE_ID }}
      MANUAL_APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MANUAL_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      MANUAL_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GENERAL_TOKEN_REPO_WORKFLOW: ${{ secrets.GENERAL_TOKEN_REPO_WORKFLOW }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Notarization ID
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: |
            .notarization_id
            .notarization_tag
          key: notarize-ready-
          restore-keys: |
            notarize-ready-
            notarize-id-

      - name: Check Status
        id: status-check
        run: |
          node scripts/check-notarize.js

      - name: Late Stapling (Download, Staple, Upload)
        if: ${{ steps.status-check.outputs.accepted == 'true' }}
        run: |
          TAG=$(cat .notarization_tag 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "❌ No tag metadata found. Cannot staple."
            exit 1
          fi
          
          echo "📦 Processing Release: $TAG"
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern "*.dmg"
          
          DMG_PATH=$(ls dist/*.dmg | head -n 1)
          if [ -z "$DMG_PATH" ]; then
             echo "❌ No DMG found in release."
             exit 1
          fi
          
          echo "📜 Stapling $DMG_PATH..."
          xcrun stapler staple "$DMG_PATH"
          
          echo "🚀 Re-uploading stapled asset..."
          gh release upload "$TAG" "$DMG_PATH" --clobber
          
          printf '' > .notarization_id
          printf '' > .notarization_tag

      - name: Save Cache State
        if: ${{ always() && steps.status-check.outputs.accepted == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .notarization_id
            .notarization_tag
          key: notarize-ready-${{ github.run_id }}
